name: Update PSG scores

on:
  schedule:
    # Ces horaires (en UTC) couvrent la fenêtre "21h-8h heure de Paris",
    # été ET hiver confondus. L'étape "Check match window" ci-dessous
    # vérifie ensuite l'heure réelle de Paris et n'exécute le reste que
    # si on est bien dans la fenêtre voulue : pas besoin de retoucher ce
    # fichier au changement d'heure.
    - cron: '0 19-23 * * 2'
    - cron: '0 0-7 * * 3'
    - cron: '0 19-23 * * 3'
    - cron: '0 0-7 * * 4'
    # Une fois par jour, pour repérer un nouveau match ajouté au calendrier
    # ou rattraper un score manqué. Celle-ci s'exécute toujours.
    - cron: '15 7 * * *'
  workflow_dispatch: {}

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Check match window (heure de Paris)
        id: gate
        run: |
          # Le déclenchement manuel et le passage quotidien de rattrapage
          # s'exécutent toujours.
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "15 7 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=Europe/Paris date +%-H)
          day=$(TZ=Europe/Paris date +%u)   # 1=lundi ... 7=dimanche
          run=false
          # Mardi ou mercredi soir, à partir de 21h.
          if { [ "$day" = "2" ] || [ "$day" = "3" ]; } && [ "$hour" -ge 21 ]; then run=true; fi
          # Le lendemain matin (mercredi ou jeudi), jusqu'à 8h.
          if { [ "$day" = "3" ] || [ "$day" = "4" ]; } && [ "$hour" -lt 8 ]; then run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '20'
      - run: npm install
        if: steps.gate.outputs.run == 'true'
      - run: node scripts/update-scores.js
        if: steps.gate.outputs.run == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
