name: Update PSG scores

on:
  schedule:
    # Pendant le match (mardi/mercredi, ~20h45-minuit heure de Paris, été et
    # hiver confondus) : toutes les 5 minutes (GitHub n'autorise pas plus
    # fréquent que ça).
    - cron: '*/5 18-22 * * 2,3'
    # Après le match, jusqu'au lendemain matin : toutes les heures.
    - cron: '0 0-7 * * 3'
    - cron: '0 0-7 * * 4'
    # Une fois par jour, pour repérer un nouveau match ajouté au calendrier
    # ou rattraper un score manqué. Celle-ci s'exécute toujours.
    - cron: '15 7 * * *'
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Durée pendant laquelle le robot repasse toutes les minutes (0 = un seul passage)"
        default: '170'

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - name: Check match window (heure de Paris)
        id: gate
        run: |
          # Le déclenchement manuel et le passage quotidien de rattrapage
          # s'exécutent toujours.
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "15 7 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=Europe/Paris date +%-H)
          min=$(TZ=Europe/Paris date +%-M)
          day=$(TZ=Europe/Paris date +%u)   # 1=lundi ... 7=dimanche
          totalmin=$((hour*60+min))
          run=false
          # Mardi ou mercredi, à partir de 20h45.
          if { [ "$day" = "2" ] || [ "$day" = "3" ]; } && [ "$totalmin" -ge 1245 ]; then run=true; fi
          # Le lendemain matin (mercredi ou jeudi), jusqu'à 8h.
          if { [ "$day" = "3" ] || [ "$day" = "4" ]; } && [ "$hour" -lt 8 ]; then run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '20'
      - run: npm install
        if: steps.gate.outputs.run == 'true'
      - run: |
          # Passage manuel : le robot repasse toutes les minutes pendant
          # LOOP_MINUTES minutes (plus fiable que les passages automatiques
          # de GitHub, qui sont souvent sautés). Sinon : un seul passage.
          end=$(( $(date +%s) + ${LOOP_MINUTES:-0} * 60 ))
          node scripts/update-scores.js
          while [ "$(date +%s)" -lt "$end" ]; do
            sleep 60
            node scripts/update-scores.js || true
          done
        if: steps.gate.outputs.run == 'true'
        env:
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
